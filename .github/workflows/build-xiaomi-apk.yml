name: Build signed CleanYourTV for Xiaomi MiTV-MZTU0

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Official CleanYourTV version tag to build"
        required: true
        default: "v2.4.0"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build updatable signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Validate official tag format
        env:
          UPSTREAM_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          [[ "$UPSTREAM_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version tag"; exit 1; }

      - name: Check out personal encrypted signing bundle
        uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false

      - name: Check out official CleanYourTV source at selected tag
        uses: actions/checkout@v4
        with:
          repository: Gathin23/cleanyourtv
          ref: ${{ inputs.version }}
          path: upstream
          persist-credentials: false

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK Platform 34
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare fixed private signing key
        env:
          CTV_SIGNING_KEY: ${{ secrets.CLEANYOURTV_SIGNING_KEY }}
        shell: bash
        run: |
          if [ -z "$CTV_SIGNING_KEY" ]; then
            echo "Missing repository secret CLEANYOURTV_SIGNING_KEY"
            exit 1
          fi
          python3 -m pip install --disable-pip-version-check --quiet 'cryptography==46.0.4'
          python3 - <<'PY'
          import os, base64, io, zipfile
          from pathlib import Path
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          secret = os.environ.get("CTV_SIGNING_KEY", "")
          try:
              key = base64.urlsafe_b64decode(secret + "=" * (-len(secret) % 4))
              assert len(key) == 32
              blob = base64.b64decode(Path("control/.github/ctv-signing.enc.b64").read_text().strip(), validate=True)
              clear = AESGCM(key).decrypt(blob[:12], blob[12:], b"Josephchang27/cleanyourtv:CTVSIGNv1")
              with zipfile.ZipFile(io.BytesIO(clear)) as z:
                  assert set(z.namelist()) == {"clean-tv.p12", "signing.properties"}
                  keystore = z.read("clean-tv.p12")
                  properties = z.read("signing.properties")
          except Exception:
              raise SystemExit("Unable to decrypt signing bundle: check CLEANYOURTV_SIGNING_KEY")
          target = Path("upstream/launcher")
          a = target / "ctv-signing.p12"
          b = target / "ctv-signing.properties"
          a.write_bytes(keystore)
          b.write_bytes(properties)
          a.chmod(0o600)
          b.chmod(0o600)
          print("Private signing key recovered in ephemeral runner; not published")
          PY

      - name: Configure Xiaomi Live TV and fixed APK signing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          config = Path("upstream/launcher/app/src/main/res/values/config.xml")
          content = config.read_text(encoding="utf-8")
          old = '<string name="live_tv_package" translatable="false">com.mediatek.wwtv.tvcenter</string>'
          new = '<string name="live_tv_package" translatable="false">com.mitv.livetv</string>'
          if content.count(old) != 1:
              raise SystemExit("Unknown upstream Live TV configuration; stop and review")
          config.write_text(content.replace(old, new), encoding="utf-8")

          gradle = Path("upstream/launcher/app/build.gradle")
          g = gradle.read_text(encoding="utf-8")
          anchor = "\nandroid {\n"
          if g.count(anchor) != 1 or g.count("    buildTypes {") != 1 or g.count("signingConfig signingConfigs.debug") != 1:
              raise SystemExit("Unknown upstream Gradle signing configuration; stop and review")
          g = g.replace(anchor, """
          def ctvSigning = new Properties()
          file('../ctv-signing.properties').withInputStream { ctvSigning.load(it) }

          android {
          """, 1)
          g = g.replace("    buildTypes {", """
              signingConfigs {
                  ctvRelease {
                      storeFile file('../ctv-signing.p12')
                      storePassword ctvSigning.getProperty('storePassword')
                      keyAlias ctvSigning.getProperty('keyAlias')
                      keyPassword ctvSigning.getProperty('keyPassword')
                      storeType 'pkcs12'
                  }
              }

              buildTypes {""", 1)
          g = g.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.ctvRelease", 1)
          gradle.write_text(g, encoding="utf-8")
          PY

      - name: Compile signed APK and verify expected certificate
        working-directory: upstream/launcher
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$apk" | tee /tmp/apk-signers.txt
          grep -iq "c26c08a6fe2cb9891f2f17f5472d10ea4848b905bd9c6948b9cc019379374795" /tmp/apk-signers.txt || {
            echo "APK signature fingerprint did not match private signing key"; exit 1;
          }
          sha256sum "$apk"

      - name: Publish APK only (not private signing material)
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-MiTV-MZTU0-${{ inputs.version }}-fixed-signature
          path: upstream/launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 60
